name: Installers

# Runs only when started by hand from the Actions tab (Run workflow): never on push or PR.
on:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
          - os: macos-latest
            task: packageDmg
          - os: ubuntu-latest
            task: packageDeb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        run: ./gradlew :desktopApp:${{ matrix.task }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KoMD-${{ matrix.task }}
          path: |
            installer/*.dmg
            installer/*.msi
            installer/*.deb
          if-no-files-found: error
